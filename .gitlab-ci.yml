stages:
  - import
  - test

# Keeps Testomat.io in sync with the repository on every push to main
import_tests:
  stage: import
  image: node:20
  script:
    - npx check-tests@latest Playwright "**/*{.,_}{test,spec,cy}.js"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"

test_job:
  stage: test
  image: node:20
  before_script:
    - npm install
    - npx playwright install --with-deps chromium
  script:
    # `testomatio`, `testomatio_url`, `run` and `grep` are passed by Testomat.io
    # when the pipeline is triggered from the UI. On merge request pipelines they
    # are empty, so fall back to the project CI/CD variables.
    - export TESTOMATIO="${testomatio:-$TESTOMATIO}"
    - export TESTOMATIO_URL="${testomatio_url:-https://app.testomat.io}"
    - export TESTOMATIO_RUN="${run}"
    - npx playwright test --grep "${grep}"
  rules:
    # Launched from Testomat.io (Runs -> Run Automated Tests in CI)
    - if: $CI_PIPELINE_SOURCE == "trigger"
    # Report results into the merge request comment (GitLab Pipe)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
